line-length = 120
target-version = "py310"

[lint]
# E/W: estilo · F: errores (imports sin usar, variables indefinidas) · I: orden de imports
# B: bugs comunes · UP: sintaxis moderna · S: seguridad (bandit) · SIM: simplificaciones
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM"]

[lint.per-file-ignores]
# En tests se usa assert y datos aleatorios no criptográficos
"tests/**" = ["S101", "S106", "S311"]
# El generador de datos sintéticos usa random a propósito
"scripts/**" = ["S311"]
