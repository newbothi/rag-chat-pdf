[pytest]
testpaths = tests
pythonpath = . tests
# Por defecto solo unitarios; la integración se pide con -m integration (el último -m gana)
addopts = -m "not integration"
# Un test colgado falla a los 60 s y muestra en qué línea estaba (en vez de esperar 6 h en CI)
timeout = 60
markers =
    integration: requiere SQL Server (TEST_DB_*); se omite si no está configurado
filterwarnings =
    ignore::DeprecationWarning
